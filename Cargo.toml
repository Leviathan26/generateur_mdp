[package]
name = "generateur_mdp"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.8"
arboard = "3.4"
aes-gcm = "0.10"
hex = "0.4.3"
winreg = "0.56.0"
slint = "1.15.1"
# Winapi est nécessaire pour manipuler la console au niveau système
winapi = { version = "0.3", features = ["wincon", "winuser"] }

[build-dependencies]
slint-build = "1.15.1"
embed-resource = "2.5"
